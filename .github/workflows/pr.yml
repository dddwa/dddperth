name: Pull Request

on:
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              name: Install pnpm
              with:
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Generate types (PandaCSS + React Router)
              run: pnpm run setup

            - name: Type Check
              run: pnpm tsc -b

            - name: Lint
              run: pnpm nx run-many --target=lint --all

            - name: Build
              run: pnpm nx build website

    a11y-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              name: Install pnpm
              with:
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Generate types (PandaCSS + React Router)
              run: pnpm run setup

            - name: Install Playwright browsers
              run: pnpm --filter website exec playwright install --with-deps chromium

            - name: Apply local D1 migrations
              run: pnpm nx d1-migrate-local website

            # No real secrets are available to (or needed by) this job — it
            # only exercises public routes. Placeholder values are enough for
            # the app to boot; SESSIONIZE_* is deliberately left unset so the
            # agenda/voting pages render their existing graceful
            # "not configured" states instead of depending on a live
            # Sessionize account during CI.
            - name: Write placeholder dev vars
              run: |
                  cat > conference/wrangler/.dev.vars <<'EOF'
                  SESSION_SECRET=ci-placeholder-secret-not-used-in-production
                  WEB_URL=http://localhost:3800
                  EOF

            # This is the accessibility backlog gate described in
            # core/website/A11Y_BACKLOG.md and the "Accessibility" section of
            # CLAUDE.md. It is intentionally non-blocking (continue-on-error)
            # while that backlog is worked through — the suite already
            # reports real, known WCAG 2.1 AA violations on some routes (e.g.
            # the unstyled /blog index), and failing the whole PR check on
            # every one of those today would make this check noise instead of
            # signal. Once the backlog is cleared, remove continue-on-error
            # so this becomes a real merge gate.
            - name: Run accessibility e2e suite (axe + focus-visible)
              id: a11y
              continue-on-error: true
              run: pnpm nx e2e website

            - name: Upload Playwright report
              if: always() && steps.a11y.outcome == 'failure'
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: core/website/playwright-report/
                  retention-days: 14

            - name: Flag non-blocking a11y failures
              if: steps.a11y.outcome == 'failure'
              run: |
                  echo "::warning::Accessibility e2e suite reported failures — see the Playwright report artifact and core/website/A11Y_BACKLOG.md. Not blocking merge yet (see comment on the previous step)."
